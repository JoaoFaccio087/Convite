<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tenho um convite pra você</title>
  <meta name="description" content="Abre aí, é rapidinho.">
  <meta name="theme-color" content="#FFD3DF">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Tenho um convite pra você 💌">
  <meta property="og:description" content="Abre aí, é rapidinho.">
  <meta property="og:image" content="https://joaofaccio087.github.io/Convite/imagem/preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://joaofaccio087.github.io/Convite/">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="imagem/carimbo.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&family=Shrikhand&display=swap">

  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <main class="palco">

    <section class="ingresso" id="tela-convite" aria-labelledby="titulo-convite">
      <div class="ingresso__corpo">
        <h1 class="nome" id="titulo-convite" tabindex="-1"><span id="nome">Sindy</span>,</h1>
        <p class="pergunta">você aceitaria sair comigo?</p>
        <p class="detalhe">O dia fica a seu critério, e o lugar a gente escolhe junto.</p>
        <p class="recado" id="recado"></p>
      </div>
      <div class="ingresso__canhoto ingresso__canhoto--botoes">
        <button class="botao botao--sim" id="btn-sim" type="button">Sim!</button>
        <button class="botao botao--nao" id="btn-nao" type="button">Não</button>
      </div>
    </section>

    <section class="ingresso" id="tela-sim" aria-labelledby="titulo-sim" hidden>
      <div class="ingresso__corpo">
        <img class="carimbo" src="imagem/carimbo.svg" alt="Carimbo: convite aceito" width="150" height="150">
        <h2 class="titulo-resposta" id="titulo-sim" tabindex="-1">Agora não tem mais volta! 😘</h2>
        <p class="detalhe">Me ajuda a planejar:</p>
      </div>
      <div class="ingresso__canhoto">
        <fieldset class="escolha">
          <legend>Qual dia fica melhor?</legend>
          <div class="opcoes" id="opcoes-dia"></div>
        </fieldset>
        <fieldset class="escolha">
          <legend>E o lugar?</legend>
          <div class="opcoes" id="opcoes-lugar"></div>
        </fieldset>
        <a class="botao botao--sim botao--largo" id="link-sim" href="#" target="_blank" rel="noopener">Responder no WhatsApp</a>
      </div>
    </section>

  </main>

  <div class="efeitos" id="efeitos" aria-hidden="true"></div>

  <script src="js/config.js"></script>
  <script src="js/convite.js"></script>
</body>
</html>
